<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050d">
<title>Astral</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Pairing. Shown until this device has a token, and again if it is revoked. -->
<section id="pair" class="screen pair" hidden>
  <div class="pair-card">
    <h1>Astral</h1>
    <p class="muted">On your PC, open Settings, then Phone access, and start pairing. Type the code it shows.</p>
    <input id="pair-code" inputmode="latin" autocapitalize="characters" autocomplete="off"
           spellcheck="false" maxlength="8" placeholder="CODE" aria-label="Pairing code">
    <input id="pair-name" type="text" autocomplete="off" placeholder="What to call this device" aria-label="Device name">
    <button id="pair-go" class="primary">Pair</button>
    <p id="pair-error" class="error" role="alert"></p>
  </div>
</section>

<!-- Home -->
<section id="home" class="screen" hidden>
  <header class="topbar">
    <h1 id="home-greeting">Astral</h1>
    <span id="home-model" class="chip"></span>
  </header>
  <div class="scroll">
    <h2 class="heading">Create</h2>
    <div id="home-start" class="rows"></div>
    <h2 class="heading">Recent</h2>
    <div id="home-recent" class="rows"></div>
  </div>
</section>

<!-- The list of every conversation -->
<section id="chats" class="screen" hidden>
  <header class="topbar"><h1>Chats</h1></header>
  <div class="scroll"><div id="chats-list" class="rows"></div></div>
</section>

<!-- The cast and the worlds -->
<section id="cast" class="screen" hidden>
  <header class="topbar"><h1>Cast</h1></header>
  <div class="scroll">
    <h2 class="heading">Characters</h2>
    <div id="cast-characters" class="rows"></div>
    <h2 class="heading">Worlds</h2>
    <div id="cast-worlds" class="rows"></div>
  </div>
</section>

<!-- Settings. The ones you change while playing; the window is still where a
     character gets written. -->
<section id="settings" class="screen" hidden>
  <header class="topbar"><h1>Settings</h1></header>
  <div class="scroll">
    <h2 class="heading">Model</h2>
    <div class="card">
      <label class="field">
        <span>Answering with</span>
        <select id="set-model"></select>
      </label>
      <label class="field">
        <span>Context window</span>
        <input id="set-numctx" type="number" inputmode="numeric" min="512" step="512">
      </label>
      <label class="field">
        <span>Reply limit</span>
        <input id="set-numpredict" type="number" inputmode="numeric" min="0" step="64">
      </label>
      <label class="field">
        <span>Temperature</span>
        <input id="set-temperature" type="number" inputmode="decimal" min="0" max="2" step="0.05">
      </label>
    </div>

    <h2 class="heading">You</h2>
    <div class="card">
      <label class="field">
        <span>Called</span>
        <input id="set-persona" type="text" autocomplete="off">
      </label>
      <label class="field field-tall">
        <span>About you</span>
        <textarea id="set-persona-note" rows="3"></textarea>
      </label>
      <label class="field">
        <span>Writing style</span>
        <select id="set-style"></select>
      </label>
    </div>

    <div class="rows" style="margin-top:14px">
      <button id="set-save" class="row row-primary">
        <span class="row-text"><span class="row-title">Save</span></span>
      </button>
    </div>

    <h2 class="heading">This device</h2>
    <div class="card">
      <p id="set-device" class="muted"></p>
      <p id="set-version" class="muted"></p>
      <p id="set-update" class="muted"></p>
    </div>
    <div class="rows" style="margin-top:10px">
      <button id="set-update-app" class="row" hidden>
        <span class="row-text">
          <span class="row-title" id="set-update-title">Check for a newer app</span>
          <span class="row-note" id="set-update-note">Downloads it through your PC and installs it</span>
        </span>
      </button>
      <a id="set-releases" class="row" href="https://github.com/EternalCoder454/astral/releases" target="_blank" rel="noreferrer">
        <span class="row-text">
          <span class="row-title">Releases page</span>
          <span class="row-note">Every build, if you would rather install one yourself</span>
        </span>
      </a>
      <button id="set-forget" class="row row-danger">
        <span class="row-text">
          <span class="row-title">Unpair this device</span>
          <span class="row-note">Forgets the token. You will need a new code.</span>
        </span>
      </button>
    </div>
  </div>
</section>

<!-- One conversation -->
<section id="chat" class="screen chat" hidden>
  <header class="topbar">
    <button id="chat-back" class="icon" aria-label="Back"><i class="tab-icon" data-icon="panel-left"></i></button>
    <h1 id="chat-title">Chat</h1>
  </header>
  <div id="transcript" class="transcript"></div>
  <form id="composer" class="composer">
    <textarea id="composer-text" rows="1" placeholder="Say something" aria-label="Message"></textarea>
    <button id="composer-send" class="send" aria-label="Send"><i class="send-icon" data-icon="send"></i></button>
  </form>
</section>

<!-- The bottom bar. It is the only navigation on a phone, so it is always
     reachable and never scrolls away. -->
<nav id="tabs" class="tabs" hidden>
  <button data-screen="home" class="tab is-on"><i class="tab-icon" data-icon="home"></i>Home</button>
  <button data-screen="chats" class="tab"><i class="tab-icon" data-icon="chat"></i>Chats</button>
  <button data-screen="cast" class="tab"><i class="tab-icon" data-icon="characters"></i>Cast</button>
  <button data-screen="settings" class="tab"><i class="tab-icon" data-icon="settings"></i>Settings</button>
</nav>

<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
