# Build, vet and test on every push.
#
# This did not exist for a long time, and the Windows and Android workflows
# hid it: they build the app, so a green tick meant the code compiled
# somewhere, while the tests only ever ran on one laptop before a push. A test
# suite nobody is obliged to run is a test suite that eventually stops passing.

name: ci

on:
  push:
    branches: [beta, release]
    paths-ignore: ["**.md", "screenshots/**", "packaging/android/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fedora rather than the runner's own Ubuntu, because the binding is
    # generated against a recent libadwaita and Ubuntu ships an older one: the
    # gotk4 sources reference adw_about_dialog_add_other_app, which is 1.6, and
    # 24.04 has 1.5, so the dependency fails to compile before any Astral code
    # is reached. This image carries the same GTK 4.22 and libadwaita 1.9 that
    # Astral is developed against, which is what should be tested anyway.
    container: fedora:44

    steps:
      - name: Install GTK and libadwaita
        run: |
          dnf -y install gtk4-devel libadwaita-devel gobject-introspection-devel \
            gcc pkgconf-pkg-config git tar gzip

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go build stamps the binary with the commit, which means it runs git,
      # which refuses a checkout owned by a different user than the one asking.
      # Inside a container that is always the case, and the build fails with
      # "error obtaining VCS status" before compiling anything.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -short skips everything that needs a model server, which a runner does
      # not have. What is left is every pure function in the project: the
      # prompt assembly, the budget arithmetic, the markup escaping, the
      # pairing, the store.
      - name: Test
        run: go test -short ./...

      # The race detector cannot initialise GTK (checkptr aborts inside a gotk4
      # dependency), so the packages that touch it are tagged out of it and the
      # rest still get checked.
      - name: Test under the race detector
        run: go test -race -short ./...

  staticcheck:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install GTK and libadwaita
        run: |
          dnf -y install gtk4-devel libadwaita-devel gobject-introspection-devel \
            gcc pkgconf-pkg-config git tar gzip
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
