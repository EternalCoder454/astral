# Build, vet and test on every push.
#
# This did not exist for a long time, and the Windows and Android workflows
# hid it: they build the app, so a green tick meant the code compiled
# somewhere, while the tests only ever ran on one laptop before a push. A test
# suite nobody is obliged to run is a test suite that eventually stops passing.

name: ci

on:
  push:
    branches: [beta, release]
    # No paths-ignore for documentation. WHATSNEW.md is asserted on by
    # TestShippedNotes, so skipping a run for a Markdown change skipped the one
    # file whose edits can fail the suite. The exclusion was there to dodge a
    # sixteen minute run; a run is ninety seconds now.
    paths-ignore: ["screenshots/**", "packaging/android/**"]
  pull_request:
  workflow_dispatch:

# A push supersedes the one before it on the same branch. Three runs of the
# same suite racing for runners answers the same question three times, and the
# answer that matters is the one for the newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Fedora rather than the runner's own Ubuntu, because the binding is
    # generated against a recent libadwaita and Ubuntu ships an older one: the
    # gotk4 sources reference adw_about_dialog_add_other_app, which is 1.6, and
    # 24.04 has 1.5, so the dependency fails to compile before any Astral code
    # is reached. This image carries the same GTK 4.22 and libadwaita 1.9 that
    # Astral is developed against, which is what should be tested anyway, and
    # it arrives with the toolchain and the dependency object code already in
    # it. See packaging/ci/Dockerfile.
    container:
      image: ghcr.io/eternalcoder454/astral-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The image's own cache directories. Repeated here because a job's
    # environment is assembled by the runner, and a cache Go cannot find is a
    # cold build wearing the image's clothes.
    env:
      GOPATH: /opt/go
      GOCACHE: /opt/gocache
      GOMODCACHE: /opt/go/pkg/mod

    steps:
      - name: Put the toolchain on the path
        run: |
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo /opt/go/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      # go build stamps the binary with the commit, which means it runs git,
      # which refuses a checkout owned by a different user than the one asking.
      # Inside a container that is always the case, and the build fails with
      # "error obtaining VCS status" before compiling anything.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -short skips everything that needs a model server, which a runner does
      # not have. What is left is every pure function in the project: the
      # prompt assembly, the budget arithmetic, the markup escaping, the
      # pairing, the store.
      - name: Test
        run: go test -short ./...

      # The race detector cannot initialise GTK (checkptr aborts inside a gotk4
      # dependency), so the packages that touch it are tagged out of it and the
      # rest still get checked.
      - name: Test under the race detector
        run: go test -race -short ./...

  staticcheck:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/eternalcoder454/astral-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GOPATH: /opt/go
      GOCACHE: /opt/gocache
      GOMODCACHE: /opt/go/pkg/mod
    steps:
      - name: Put the toolchain on the path
        run: |
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          echo /opt/go/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Installed in the image, not here.
      - name: Staticcheck
        run: staticcheck ./...
