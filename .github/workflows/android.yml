# Build the phone app.
#
# It is a WebView around the interface the PC serves, so there is very little
# here: the whole of Astral is in the Go binary, and this is a window onto it.
#
# The APK is signed with the debug key on purpose. It is sideloaded onto one
# person's own phone to talk to one person's own PC; there is no store to
# publish to, and a signing identity invented for CI protects nobody.

name: android

on:
  push:
    branches: [beta, release]
    paths:
      - "packaging/android/**"
      - "internal/serve/web/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/android

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already carries the Android SDK. The setup action was
      # here first and fails on its own default package list, which still asks
      # for "tools" — a package Google removed. Using what is already installed
      # is both shorter and one fewer thing to break.
      - name: Install what we build against
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Held at v4 deliberately. v6 moved this action's caching into a separate
      # library that is no longer open source, and a build this small gains
      # nothing from the cache to trade for that. v4 is not one of the actions
      # GitHub is deprecating.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name it after the version
        id: name
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' ../../internal/app/version.go)
          echo "version: $VERSION"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/astral-$VERSION.apk"
          echo "apk=packaging/android/out/astral-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: astral-android
          path: packaging/android/out/*.apk

      # The same notes the Windows job writes, deliberately duplicated.
      #
      # Both jobs attach to one release and whichever finishes last wins: with
      # no body of its own this one sent an empty string and wiped the notes
      # the other had just written, which is how 0.3.0 reached its draft with
      # nothing in it. Sending the same text from both makes the order stop
      # mattering.
      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' ../../internal/app/version.go)
          awk -v v="$VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' ../../WHATSNEW.md > release-notes.md
          cat release-notes.md

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.name.outputs.apk }}
          draft: true
          generate_release_notes: false
          body_path: packaging/android/release-notes.md
