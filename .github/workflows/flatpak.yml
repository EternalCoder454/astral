# Build Astral as a Flatpak bundle, so it installs on any Linux distribution.
#
# A native build needs libadwaita 1.9, which Linux Mint 22, Ubuntu 24.04 and
# Debian 12 and 13 do not ship. The Flatpak brings GNOME 50's own.

name: flatpak

on:
  push:
    branches: [beta]
    paths-ignore: ["**.md", "screenshots/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reuse:
        description: "A commit whose beta build to reuse, to try the path a release tag takes"
        required: false
        default: ""

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # To find this commit's build on beta and download it; see below.
  actions: read

jobs:
  # A release tag is always on a commit beta built minutes before, and the
  # build is eighteen minutes, most of it compiling gotk4. The tag takes beta's
  # bundle for the commit instead, and builds only when there is none. Its own
  # job, on the plain runner, because the builder image need not have gh.
  prebuilt:
    if: startsWith(github.ref, 'refs/tags/') || inputs.reuse != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: Look for this commit's build on beta
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.reuse || github.sha }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow flatpak.yml --branch beta \
            --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "beta build of $SHA: ${run:-none, so building it here}"

  reuse:
    needs: prebuilt
    if: needs.prebuilt.outputs.run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)
          echo "version: $VERSION"
          echo "ASTRAL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Take beta's bundle
        uses: actions/download-artifact@v8
        with:
          name: astral-flatpak
          run-id: ${{ needs.prebuilt.outputs.run }}
          github-token: ${{ github.token }}

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: astral-flatpak
          path: astral-${{ env.ASTRAL_VERSION }}-x86_64.flatpak

      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v v="$ASTRAL_VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' WHATSNEW.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: astral-${{ env.ASTRAL_VERSION }}-x86_64.flatpak
          draft: true
          generate_release_notes: false
          body_path: release-notes.md

  build:
    # Whenever there is no beta build to take: every push to beta, and a tag
    # whose commit beta did not build. The lookup being skipped or failing
    # counts as none.
    needs: prebuilt
    if: ${{ !cancelled() && needs.prebuilt.outputs.run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)
          echo "version: $VERSION"
          echo "ASTRAL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: astral-${{ env.ASTRAL_VERSION }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.astral.yml
          runtime-repo: https://dl.flathub.org/repo/flathub.flatpakrepo
          # The action restores only keys starting flatpak-builder-x86_64 and
          # appends the arch itself. Keyed on the commit, as this was, it never
          # restored anything, and every run compiled everything. Keyed on what
          # the dependency module is built from, it restores the last build's
          # state, and saves a new one only when those change.
          cache-key: flatpak-builder-x86_64-${{ hashFiles('go.sum', 'packaging/flatpak/io.github.astral.yml') }}
          restore-cache: true

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: astral-flatpak
          path: astral-${{ env.ASTRAL_VERSION }}-x86_64.flatpak

      # The release body is this version's notes, not the whole file.
      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v v="$ASTRAL_VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' WHATSNEW.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: astral-${{ env.ASTRAL_VERSION }}-x86_64.flatpak
          draft: true
          generate_release_notes: false
          body_path: release-notes.md
