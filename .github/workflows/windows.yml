# Build Astral for Windows and package it as an installer.
#
# Astral is Go with cgo against GTK4 and libadwaita, so it cannot be
# cross-compiled from Linux in any way worth relying on: the toolchain, the
# libraries and pkg-config all have to be the target's. It is built on a
# Windows runner under MSYS2 instead, which is the same environment GTK itself
# is packaged for on Windows.
#
# libadwaita is a GNOME library and Windows is not a platform GNOME supports.
# It builds and it runs, and that is the whole of the promise being made here.

name: windows

# Not on the release branch: it only ever fast-forwards to a beta commit that
# was built already, and building it again beside the tag's build doubled the
# Windows jobs of every release for nothing.
on:
  push:
    branches: [beta]
    paths-ignore: ["**.md", "screenshots/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reuse:
        description: "A commit whose beta build to reuse, to try the path a release tag takes"
        required: false
        default: ""

# A newer push to the same branch makes an older build pointless.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # To find this commit's build on beta and download it; see below.
  actions: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      # A release tag is always on a commit beta built minutes before, and a
      # tag cannot use beta's Go cache, only the default branch's, which
      # nothing fills: every tag compiled gotk4 from cold, 1106s of a 1335s
      # run for v0.5.33. It takes beta's installer for the commit instead, and
      # builds only when there is none, as before.
      - name: Look for this commit's build on beta
        id: prebuilt
        if: startsWith(github.ref, 'refs/tags/') || inputs.reuse != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.reuse || github.sha }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --branch beta \
            --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "beta build of $SHA: ${run:-none, so building it here}"
          echo "ASTRAL_VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)" >> "$GITHUB_ENV"

      - name: Take beta's installer
        if: steps.prebuilt.outputs.run != ''
        uses: actions/download-artifact@v8
        with:
          name: astral-windows-installer
          path: packaging/output
          run-id: ${{ steps.prebuilt.outputs.run }}
          github-token: ${{ github.token }}

      # This step was most of the run, two and a half minutes of four. Most of
      # it was upgrading every package in a fresh MSYS2 before installing
      # anything (update), and the whole toolchain group, which brings gdb and
      # a Python with it, where cgo needs only gcc. git went too: go build no
      # longer asks it for the commit (-buildvcs=false below), and the version
      # comes from version.go.
      - name: Set up MSYS2
        if: steps.prebuilt.outputs.run == ''
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gobject-introspection-runtime
            mingw-w64-x86_64-go
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-adwaita-icon-theme

      # gotk4 asks pkg-config for gobject-introspection, and wants only its
      # headers and link flags from it; the library is the runtime package
      # above. Installed without its dependencies it no longer brings a Python
      # and a Tcl along, several hundred megabytes of files to unpack that
      # nothing here runs.
      - name: Add the gobject-introspection headers
        if: steps.prebuilt.outputs.run == ''
        run: pacman -S --noconfirm --needed --nodeps --nodeps mingw-w64-x86_64-gobject-introspection

      - name: Locate the Go caches
        if: steps.prebuilt.outputs.run == ''
        id: gocache
        run: |
          echo "build=$(cygpath -w "$(go env GOCACHE)")" >> "$GITHUB_OUTPUT"
          echo "mod=$(cygpath -w "$(go env GOMODCACHE)")" >> "$GITHUB_OUTPUT"

      # gotk4 is an enormous generated codebase and compiling it from cold
      # takes the better part of half an hour. Caching it is the difference
      # between a CI round being worth doing and not.
      - name: Restore the Go caches
        if: steps.prebuilt.outputs.run == ''
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-windows-${{ hashFiles('go.sum') }}
          restore-keys: go-windows-

      - name: Report the toolchain
        if: steps.prebuilt.outputs.run == ''
        run: |
          go version
          # gotk4 needs gobject-introspection as well as GTK itself, which is
          # not obvious from the import path and cost one CI round to find.
          pkg-config --modversion gtk4 libadwaita-1 gobject-introspection-1.0

      - name: Build
        if: steps.prebuilt.outputs.run == ''
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)
          echo "version: $VERSION"
          echo "ASTRAL_VERSION=$VERSION" >> "$GITHUB_ENV"
          # -H windowsgui keeps a console window from opening behind the app.
          go build -buildvcs=false \
            -ldflags "-s -w -H windowsgui -X 'astral/internal/app.version=$VERSION'" \
            -o dist/astral.exe .

      - name: Gather the runtime
        if: steps.prebuilt.outputs.run == ''
        run: |
          bash packaging/windows-bundle.sh dist

      - name: Upload the unpacked build
        if: steps.prebuilt.outputs.run == ''
        uses: actions/upload-artifact@v7
        with:
          name: astral-windows-portable
          path: dist/

      - name: Build the installer
        if: steps.prebuilt.outputs.run == ''
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /DAppVersion=$env:ASTRAL_VERSION packaging\astral.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: astral-windows-installer
          path: packaging/output/*.exe

      # A run's artifacts expire and need a GitHub login to fetch, which is no
      # use to someone who just wants to install the thing. A tag publishes it
      # as a release asset instead, which is a plain download.
      # The release body is this version's notes, not the whole file. Pointing
      # the action at WHATSNEW.md wholesale would put every version Astral has
      # ever had into the announcement of one of them.
      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/')
        # Plain bash: MSYS2 is not set up when beta's installer is reused.
        shell: bash
        run: |
          awk -v v="$ASTRAL_VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' WHATSNEW.md > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/output/*.exe
          draft: true
          generate_release_notes: false
          body_path: release-notes.md
