# Build the image CI runs in, and push it to this repository's registry.
#
# Only when the recipe or the dependency set changes, which is rarely. The
# whole point is that the expensive work happens here instead of in every test
# run.

name: ci-image

on:
  push:
    branches: [beta]
    paths:
      - "packaging/ci/Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default builder cannot export a cache, so the layer cache below
      # would be refused. This one can.
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/ci/Dockerfile
          push: true
          tags: ghcr.io/eternalcoder454/astral-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
